<!doctype html>
<html>
<head><meta charset="UTF-8"><title>Generate LaterMe Icons</title></head>
<body>
  <h2>LaterMe Icon Generator</h2>
  <p>Open this page in a browser, then click each button to download icons. Save them to <code>public/icons/</code>.</p>
  <div id="buttons"></div>
  <script>
    const sizes = [16, 48, 128];
    const container = document.getElementById('buttons');

    sizes.forEach(size => {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      // Background: rounded rect with indigo gradient
      const r = size * 0.2;
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = '#4F46E5';
      ctx.fill();

      // Draw a simple bookmark shape or "L" letter
      ctx.fillStyle = '#FFFFFF';
      ctx.font = `bold ${size * 0.55}px -apple-system, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('L', size / 2, size / 2 + 1);

      const btn = document.createElement('button');
      btn.textContent = `Download ${size}x${size}`;
      btn.style.cssText = 'display:block; margin:10px 0; padding:8px 16px; cursor:pointer;';
      btn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `icon${size}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
      container.appendChild(btn);
    });
  </script>
</body>
</html>
