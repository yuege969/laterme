<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新标签页</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="newtab-container">
    <div class="newtab-main">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">----年--月--日</div>
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="在 Google 上搜索…" />
      </div>
    </div>

    <div id="resurfacingBanner" class="resurfacing-banner hidden">
      <div class="resurfacing-inner">
        <button class="resurfacing-close" id="resurfacingClose">×</button>
        <div class="resurfacing-header">
          <span class="resurfacing-icon">📌</span>
          <span id="resurfacingDays" class="resurfacing-days"></span>
        </div>
        <div class="resurfacing-body">
          <div id="resurfacingTitle" class="resurfacing-title"></div>
          <div id="resurfacingNote" class="resurfacing-note"></div>
        </div>
        <div class="resurfacing-actions">
          <button class="resurfacing-btn resurfacing-btn-open" id="resurfacingOpen">打开看看</button>
          <button class="resurfacing-btn resurfacing-btn-snooze" id="resurfacingSnooze">下次再说</button>
          <button class="resurfacing-btn resurfacing-btn-archive" id="resurfacingArchive">不再提醒</button>
        </div>
      </div>
    </div>
  </div>

  <script src="index.ts" type="module"></script>
</body>
</html>
