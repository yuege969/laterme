<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎使用 LaterMe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="logo">🌱</div>
      <h1 class="title">收藏，是为了再次遇见</h1>
      <p class="subtitle">给每个收藏留一句话，让未来的自己知道当时为什么按下 Ctrl+D</p>
    </div>

    <div class="steps">
      <div class="step">
        <div class="step-icon">💡</div>
        <div class="step-body">
          <h3>收藏时，埋下一颗时间胶囊</h3>
          <p>按 Ctrl+D 收藏页面时，给未来的自己留句话——现在想解决什么问题？这个页面为什么重要？</p>
        </div>
      </div>
      <div class="step">
        <div class="step-icon">💌</div>
        <div class="step-body">
          <h3>未来的某天，收到来自过去的信</h3>
          <p>LaterMe 会在合适的时候提醒你回顾那些被遗忘的收藏。你会看到几个月前自己留下的备注，想起当时的初心。</p>
        </div>
      </div>
      <div class="step">
        <div class="step-icon">🌿</div>
        <div class="step-body">
          <h3>整理你的知识花园</h3>
          <p>打开书签管理页，定期复盘清理。保留真正有价值的东西，让收藏夹不再是一个杂乱的仓库。</p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="tryBtn" class="btn-primary">开始使用</button>
      <a id="bookmarksLink" href="#" class="btn-secondary">查看我的书签</a>
    </div>

    <p class="privacy-note">所有数据保存在本地，不上传任何服务器。</p>
  </div>

  <script src="index.ts" type="module"></script>
</body>
</html>
