<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎使用 LaterMe</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="logo">📌</div>
      <h1 class="title">欢迎使用 LaterMe</h1>
      <p class="subtitle">收藏时留一句话，让收藏夹重新活过来</p>
    </div>

    <div class="steps">
      <div class="step">
        <div class="step-icon">⌨️</div>
        <div class="step-body">
          <h3>按 Ctrl+D 收藏</h3>
          <p>LaterMe 会接管 Ctrl+D 快捷键，弹出备注窗口让你写下当时的想法。</p>
        </div>
      </div>
      <div class="step">
        <div class="step-icon">💬</div>
        <div class="step-body">
          <h3>留一句话给未来的自己</h3>
          <p>备注是可选的，但写下来后，你未来重新看到这条收藏时会感谢自己。</p>
        </div>
      </div>
      <div class="step">
        <div class="step-icon">✨</div>
        <div class="step-body">
          <h3>新标签页唤醒旧收藏</h3>
          <p>每天打开新标签页时，LaterMe 会悄悄提醒你一条被遗忘的收藏。</p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button id="tryBtn" class="btn-primary">知道了，开始使用</button>
      <a id="bookmarksLink" href="#" class="btn-secondary">查看我的书签</a>
    </div>

    <p class="privacy-note">🔒 所有数据保存在本地，不上传任何服务器。</p>
  </div>

  <script src="index.ts" type="module"></script>
</body>
</html>
